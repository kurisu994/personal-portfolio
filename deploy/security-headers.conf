# 安全响应头片段。
#
# 为什么单独成文件：nginx 的 add_header 是「整段覆盖」而非「逐条合并」——
# 只要某个 location 里出现过一条 add_header，server 层级的全部 add_header
# 都会对该 location 失效。为避免安全头在带缓存策略的 location 里静默消失，
# 这里显式 include 到每一个使用了 add_header 的 location。

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
