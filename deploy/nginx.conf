# 作品集站点：一个 nginx 进程承载入口页与全部作品子目录。
#
# 关于结尾斜杠（重要）：
# migration-showcase 由 Rsbuild 以 assetPrefix: './' 构建，HTML 中所有资源都是
# 相对路径（./static/js/...）。若以 /migration-showcase（无斜杠）访问，浏览器
# 会把 ./static/ 解析到站点根，导致整站资源 404。nginx 在 URI 命中目录且该目录
# 内存在 index 文件时会自动 301 补上结尾斜杠，因此这里不手写 rewrite，避免与
# 自动重定向打架；正确性由 deploy.sh check 实际请求验证。

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 不对外暴露 nginx 版本号。
    server_tokens off;

    # 输出相对 Location，而不是绝对 URL。
    # 默认的绝对重定向会用容器内监听端口（80）拼 URL，而客户端连接的是宿主机
    # 映射端口或反向代理端口，导致 /migration-showcase -> http://host/migration-showcase/
    # 丢掉端口、并在 HTTPS 下退化成 http。相对 Location 由浏览器按当前地址解析，
    # 本地端口、反向代理、HTTPS 三种场景都正确。
    absolute_redirect off;

    # 服务层级的安全头（不带 add_header 的 location 会继承这些）。
    include /etc/nginx/snippets/security-headers.conf;

    # ── HTML：禁止缓存 ────────────────────────────────────────────────
    # 简易版整个应用就是 index.html（约 607 KiB），工程版的 index.html 是入口。
    # 两者都必须即时生效，否则发布后用户会长期看到旧版本。
    location ~* \.html?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ── 带内容哈希的构建产物：一年强缓存 ─────────────────────────────
    # 文件名含内容哈希，内容变化必然换名，可安全地 immutable。
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── 不带哈希的媒体与许可证文本：七天 ─────────────────────────────
    # 音频与分享图文件名固定，过长缓存会让替换变得不可控。
    location ~* \.(?:mp3|jpg|jpeg|png|webp|svg|ico|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ── 其余请求 ─────────────────────────────────────────────────────
    # 刻意不做 SPA 回退（try_files ... /index.html）：两件作品都是单页应用且没有
    # 前端路由，回退会把 404 伪装成 200，从而掩盖部署错误。宁可暴露 404。
    location / {
        try_files $uri $uri/ =404;
    }

    # text/html 无需列出：nginx 始终压缩它。
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml application/manifest+json;
}
