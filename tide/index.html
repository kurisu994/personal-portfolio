          ctx.fillStyle = css(ink, 0.62);
          ctx.font = `12px ${fontSerif}`;
          const ex = L.sy / L.sx;
          ctx.fillText('剖面 A—A', 12, L.secBottom - 10);
          ctx.fillStyle = css(ink, 0.42);
          ctx.font = `10.5px ${fontData}`;
          ctx.fillText(`垂直放大 ×${ex.toFixed(1)}`, 78, L.secBottom - 10);
          ctx.restore();
        }

        // ═══ 平面 ═════════════════════════════════════════════════════════
        /** 平面着色：干湿沙、痕迹的浮雕、按水深透出的水色、波峰线与泡沫花边 */
        function shadePlan(sky, time) {
          const f = field;
          const { nx, nz, dry, wetC, wet, trace, foam, depth, lace, xPhase, zPhase } = f;
          const px = f.image.data;
          const lit = sky.light;
          const day = sky.daylight;
          const deep = mixRgb(linearToSrgb(f.coast.water.deep), PAPER, 0.16 * day);
          const shallow = mixRgb(linearToSrgb(f.coast.water.shallow), PAPER, 0.12 * day);
          const turb = 0.9 + f.coast.water.turbidity * 0.8;
          // 波峰线与泡沫随涌浪大小增减：泥滩与内海的小浪只留淡淡的痕迹
          const swellScale = smoothstep(0.1, 0.5, f.coast.swell.height);
          const crestGain = 26 * swellScale;
          const foamGain = 0.55 + 0.45 * swellScale;
          // 湿沙反一点天光
          const skyTint = sky.horizon;
          const tPhase = time / f.coast.swell.period;
          const lr = lit[0];
          const lg = lit[1];
          const lb = lit[2];
          for (let j = 0; j < nz; j++) {
            const zp = zPhase[j] + tPhase;
            const edgeRow = j === 0 || j === nz - 1;
            let k = j * nx;
            for (let i = 0; i < nx; i++, k++) {
              const w = wet[k];
              const k3 = k * 3;
              let r = dry[k3] + (wetC[k3] - dry[k3]) * w;
              let g = dry[k3 + 1] + (wetC[k3 + 1] - dry[k3 + 1]) * w;
              let b = dry[k3 + 2] + (wetC[k3 + 2] - dry[k3 + 2]) * w;
              if (w > 0.05) {
                const t = w * 0.12;
                r += (skyTint[0] - r) * t;
                g += (skyTint[1] - g) * t;
                b += (skyTint[2] - b) * t;
              }
              const tr = trace[k];
              if (tr > 0.004 && !edgeRow && i > 0 && i < nx - 1) {
                // 沟槽：迎光的一壁亮、背光的一壁暗，沟底露出更湿更深的沙
                const e = trace[k - 1 - nx] - trace[k + 1 + nx];
                const s = e * 92 - tr * 30;
                r += s;
                g += s;
                b += s * 0.94;
              }
              const d = depth[k];
              if (d > 0) {
                const a = Math.min(0.95, 1 - Math.exp(-d * turb));
                const m = 1 - Math.exp(-d * 0.5);
                let wr = shallow[0] + (deep[0] - shallow[0]) * m;
                let wg = shallow[1] + (deep[1] - shallow[1]) * m;
                let wb = shallow[2] + (deep[2] - shallow[2]) * m;
                if (d > 0.15 && crestGain > 1) {
                  // 涌浪波峰线：一条条向岸推进的亮线
                  const ph = xPhase[i] + zp;
                  const fr = ph - Math.floor(ph);
                  const crest = fr < 0.1 ? (1 - fr / 0.1) * Math.min(1, (d - 0.15) * 1.5) * crestGain : 0;
                  wr += crest;
                  wg += crest;
                  wb += crest;
                }
                r += (wr - r) * a;
                g += (wg - g) * a;
                b += (wb - b) * a;
              }
              const fo = foam[k];
              if (fo > 0.03) {
                const amount = fo * lace[k] * foamGain;
                r += (252 - r) * amount;
                g += (250 - g) * amount;
                b += (244 - b) * amount;
              }
              const p = k * 4;
              px[p] = r * lr;
              px[p + 1] = g * lg;
              px[p + 2] = b * lb;
              px[p + 3] = 255;
            }
          }
        }

        // 等高线：每 0.5 米一条（平均海面加粗），按显示尺寸缓存成路径，每帧只描边
        let contours = [];
        function buildContours() {
          const f = field;
          const s = 2;
          const cols = Math.floor((f.nx - 1) / s);
          const rows = Math.floor((f.nz - 1) / s);
          let lo = Infinity;
          let hi = -Infinity;
          for (let k = 0; k < f.n; k++) {
            if (f.H[k] < lo) lo = f.H[k];
            if (f.H[k] > hi) hi = f.H[k];
          }
          const toX = (i) => ((i + 0.5) * f.cell) * L.sx;
          const toY = (j) => zy(f.z0 + (j + 0.5) * f.cell);
          contours = [];
          for (let level = Math.ceil(lo * 2) / 2; level <= hi; level += 0.5) {
            const path = new Path2D();
            for (let r = 0; r < rows; r++) {
              for (let q = 0; q < cols; q++) {
                const i = q * s;
                const j = r * s;
                const a = f.H[j * f.nx + i] - level;
                const b = f.H[j * f.nx + i + s] - level;
                const c = f.H[(j + s) * f.nx + i + s] - level;
                const d = f.H[(j + s) * f.nx + i] - level;
                const code = (a > 0 ? 8 : 0) | (b > 0 ? 4 : 0) | (c > 0 ? 2 : 0) | (d > 0 ? 1 : 0);
                if (code === 0 || code === 15) continue;
                // 四条边上的交点（插值）
                const top = [toX(i + (s * a) / (a - b)), toY(j)];
                const rgt = [toX(i + s), toY(j + (s * b) / (b - c))];
                const bot = [toX(i + (s * d) / (d - c)), toY(j + s)];
                const lft = [toX(i), toY(j + (s * a) / (a - d))];
                const seg = (p, qq) => {
                  path.moveTo(p[0], p[1]);
                  path.lineTo(qq[0], qq[1]);
                };
                switch (code) {
                  case 1: case 14: seg(lft, bot); break;
                  case 2: case 13: seg(bot, rgt); break;
                  case 3: case 12: seg(lft, rgt); break;
                  case 4: case 11: seg(top, rgt); break;
                  case 5: seg(lft, top); seg(bot, rgt); break;
                  case 6: case 9: seg(top, bot); break;
                  case 7: case 8: seg(lft, top); break;
                  case 10: seg(lft, bot); seg(top, rgt); break;
                }
              }
            }
            contours.push({ level, path });
          }
        }

        function drawPlan(ink) {
          const f = field;
          planContext.putImageData(f.image, 0, 0);
          const srcY = (L.planZ0 - f.z0) / f.cell;
          const srcH = (L.planZ1 - L.planZ0) / f.cell;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(planBuffer, 0, srcY, f.nx, srcH, 0, L.planTop, W, L.planHeight);

          ctx.save();
          ctx.beginPath();
          ctx.rect(0, L.planTop, W, L.planHeight);
          ctx.clip();
          ctx.lineWidth = 0.8;
          for (const c of contours) {
            ctx.strokeStyle = css(ink, c.level === 0 ? 0.3 : Number.isInteger(c.level) ? 0.17 : 0.09);
            ctx.stroke(c.path);
          }

          // 剖切线 A—A：点划线
          const y = Math.round(zy(state.cut)) + 0.5;
          ctx.strokeStyle = css(ink, 0.7);
          ctx.lineWidth = 1;
          ctx.setLineDash([14, 4, 2, 4]);
          ctx.beginPath();
          ctx.moveTo(30, y);
          ctx.lineTo(W - 30, y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();

          ctx.save();
          ctx.fillStyle = css(ink, 0.9);
          ctx.font = `600 11px ${fontData}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.beginPath();
          ctx.moveTo(W - 22, y - 5);
          ctx.lineTo(W - 22, y + 5);
          ctx.lineTo(W - 14, y);
          ctx.closePath();
          ctx.fill();
          ctx.fillText('A', W - 26, y - 12);

          // 平面框与图注
          ctx.strokeStyle = css(ink, 0.5);
          ctx.lineWidth = 1;
          ctx.strokeRect(0.5, Math.round(L.planTop) + 0.5, W - 1, Math.round(L.planHeight) - 1);
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = css(ink, 0.62);
          ctx.font = `12px ${fontSerif}`;
          ctx.fillText('平面', 12, L.planTop - 9);
          drawScaleBar(ink, 52, L.planTop - 12);
          drawNorth(ink, W - (L.narrow ? 22 : 34), L.planTop - (L.narrow ? 16 : 18));
          ctx.restore();
        }

        /** 比例尺：取一个整齐的长度，约占百余像素 */
        function drawScaleBar(ink, x, y) {
          const target = (L.narrow ? 70 : 120) / L.sx;
          const nice = [5, 10, 20, 25, 50, 100].find((v) => v >= target * 0.7) ?? 100;
          const w = nice * L.sx;
          ctx.strokeStyle = css(ink, 0.6);
          ctx.fillStyle = css(ink, 0.6);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y - 3);
          ctx.lineTo(x, y + 1);
          ctx.lineTo(x + w, y + 1);
          ctx.lineTo(x + w, y - 3);
          ctx.moveTo(x + w / 2, y + 1);
          ctx.lineTo(x + w / 2, y - 2);
          ctx.stroke();
          ctx.fillRect(x, y - 1, w / 2, 2);
          ctx.font = `10.5px ${fontData}`;
          ctx.fillStyle = css(ink, 0.45);
          ctx.fillText(`${nice} 米`, x + w + 8, y + 3);
        }

        /** 指北针：平面里 +x 指向海岸的朝向方位角，北方由此转出 */
        function drawNorth(ink, x, y) {
          const a = -field.coast.facing * DEG;
          const dx = Math.cos(a);
          const dy = Math.sin(a);
          ctx.strokeStyle = css(ink, 0.6);
          ctx.fillStyle = css(ink, 0.7);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - dx * 9, y - dy * 9);
          ctx.lineTo(x + dx * 9, y + dy * 9);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x + dx * 10, y + dy * 10);
          ctx.lineTo(x + dx * 4 - dy * 3.5, y + dy * 4 + dx * 3.5);
          ctx.lineTo(x + dx * 4 + dy * 3.5, y + dy * 4 - dx * 3.5);
          ctx.closePath();
          ctx.fill();
          ctx.font = `600 10px ${fontData}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('N', x + dx * 17, y + dy * 17);
        }

        /** 水边线投影：剖面里水与沙的交点，竖直落到平面的剖切线上 */
        function drawProjection(ink) {
          const xs = shorelineX(state.level, state.cut);
          if (xs <= field.x0 || xs >= field.x1) return;
          const x = Math.round(sx(xs)) + 0.5;
          ctx.save();
          ctx.strokeStyle = css(ink, 0.4);
          ctx.lineWidth = 1;
          ctx.setLineDash([1.5, 3.5]);
          ctx.beginPath();
          ctx.moveTo(x, hy(state.level) + 4);
          ctx.lineTo(x, zy(state.cut) - 4);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = css(ink, 0.55);
          ctx.font = `10.5px ${fontSerif}`;
          const flip = x > W - 96;
          ctx.textAlign = flip ? 'right' : 'left';
          ctx.fillText('水边线', flip ? x - 5 : x + 5, L.planTop - 9);
          ctx.restore();
        }

        /** 写字模式下，跟着指针预览字落下的位置与大小 */
        function drawGhost(ink) {
          if (state.tool !== 'text' || !hover || !textInput.value.trim()) return;
          ctx.save();
          ctx.fillStyle = css(ink, 0.35);
          ctx.font = `600 ${Math.round(textHeight() * L.sx)}px ${fontSerif}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(textInput.value.trim(), hover.cx, hover.cy);
          ctx.restore();
        }

        // ═══ 潮汐表 ═══════════════════════════════════════════════════════
        const tablePlot = document.getElementById('table-plot');
        let day = null;

        function renderTable() {
          const c = coast();
          const env = tideEnvelope(c);
          const datum = chartDatum(c);
          // 上方留白给高潮标注，下方留白给低潮标注
          const toY = (h) => (0.78 - ((h - env.min) / (env.max - env.min)) * 0.46) * 100;
          const line = day.curve.map(([x, h], i) => `${i ? 'L' : 'M'}${(x * 1000).toFixed(1)},${toY(h).toFixed(2)}`).join('');
          document.getElementById('table-line').setAttribute('d', line);
          document.getElementById('table-area').setAttribute('d', `${line}L1000,100L0,100Z`);
          const msl = document.getElementById('table-msl');
          msl.setAttribute('y1', toY(0));
          msl.setAttribute('y2', toY(0));
          document.getElementById('table-day').style.backgroundImage = day.gradient;
          const marks = document.getElementById('table-marks');
          marks.replaceChildren(
            ...day.extrema.map((e) => {
              const el = document.createElement('span');
              el.className = `table__mark table__mark--${e.kind}`;
              el.style.left = `${e.p * 100}%`;
              el.style.top = `${toY(e.height)}%`;
              const height = `${(e.height - datum).toFixed(1)} m`;
              el.innerHTML = e.kind === 'high' ? `<b>${e.clock}</b><i>${height}</i>` : `<b>${e.clock}<i>${height}</i></b>`;
              return el;
            }),
          );
        }

        function seekTable(clientX) {
          const rect = tablePlot.getBoundingClientRect();
          setTime(day.start + (day.end - day.start) * clamp((clientX - rect.left) / rect.width, 0, 1));
        }

        tablePlot.addEventListener('pointerdown', (e) => {
          tablePlot.setPointerCapture(e.pointerId);
          seekTable(e.clientX);
        });
        tablePlot.addEventListener('pointermove', (e) => {
          if (tablePlot.hasPointerCapture(e.pointerId)) seekTable(e.clientX);
        });
        tablePlot.addEventListener('keydown', (e) => {
          const step = (e.shiftKey ? 60 : 10) / 1440;
          const map = { ArrowLeft: state.jd - step, ArrowRight: state.jd + step, Home: day.start, End: day.end - 1 / 1440 };
          if (!(e.key in map)) return;
          e.preventDefault();
          setTime(map[e.key]);
        });

        // ═══ 音景（与工程版 audio/Surf.ts 同一套三层合成） ═══════════════
        // 涌浪的「沙——」与回落的砾石声、40–120 Hz 的底层涌声、浪退时泡沫破裂的细碎声，
        // 全部由噪声与滤波合成，不需要任何音频素材。首次点击声音按钮后才创建 AudioContext。
        const surf = {
          ctx: null,
          master: null,
          lowGain: null,
          white: null,
          lastWave: -1,
          fizzBudget: 0,
          enabled: false,
        };

        function buildAudio() {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          const a = new Ctx();
          surf.ctx = a;
          surf.master = a.createGain();
          surf.master.gain.value = 0;
          surf.master.connect(a.destination);
          const white = a.createBuffer(1, a.sampleRate * 4, a.sampleRate);
          const w = white.getChannelData(0);
          for (let i = 0; i < w.length; i++) w[i] = Math.random() * 2 - 1;
          surf.white = white;
          const brown = a.createBuffer(1, a.sampleRate * 4, a.sampleRate);
          const b = brown.getChannelData(0);
          let last = 0;
          for (let i = 0; i < b.length; i++) {
            last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
            b[i] = last * 3.2;
          }
          const low = a.createBufferSource();
          low.buffer = brown;
          low.loop = true;
          const lowpass = a.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.value = 110;
          surf.lowGain = a.createGain();
          surf.lowGain.gain.value = 0.2;
          low.connect(lowpass).connect(surf.lowGain).connect(surf.master);
          low.start();
        }

        async function setSound(on) {
          surf.enabled = on;
          if (on && !surf.ctx) buildAudio();
          if (!surf.ctx) return false;
          if (on) await surf.ctx.resume();
          surf.master.gain.setTargetAtTime(on ? 0.9 : 0, surf.ctx.currentTime, 0.4);
          return on;
        }

        /** 一道浪：上涌的「沙——」与回落时的砾石声 */
        function surfWave(loud) {
          const a = surf.ctx;
          const now = a.currentTime;
          const src = a.createBufferSource();
          src.buffer = surf.white;
          src.playbackRate.value = 0.9 + Math.random() * 0.2;
          const band = a.createBiquadFilter();
          band.type = 'bandpass';
          band.frequency.setValueAtTime(420, now);
          band.frequency.linearRampToValueAtTime(900 + Math.random() * 300, now + 0.9);
          band.frequency.exponentialRampToValueAtTime(380, now + 4.5);
          band.Q.value = 0.55;
          const gain = a.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.5 * loud, now + 0.7);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.2);
          src.connect(band).connect(gain).connect(surf.master);
          src.start(now, Math.random() * 2);
          src.stop(now + 5.4);
          const back = a.createBufferSource();
          back.buffer = surf.white;
          const high = a.createBiquadFilter();
          high.type = 'highpass';
          high.frequency.value = 3200;
          const backGain = a.createGain();
          backGain.gain.setValueAtTime(0.0001, now + 1.6);
          backGain.gain.exponentialRampToValueAtTime(0.08 * loud, now + 2.4);
          backGain.gain.exponentialRampToValueAtTime(0.0001, now + 4.6);
          back.connect(high).connect(backGain).connect(surf.master);
          back.start(now + 1.6, Math.random() * 2);
          back.stop(now + 4.8);
          surf.fizzBudget = 40 * loud;
        }

        /** 泡沫破裂：极短的高频脉冲 */
        function surfFizz(loud) {
          const a = surf.ctx;
          const now = a.currentTime;
          const src = a.createBufferSource();
          src.buffer = surf.white;
          const high = a.createBiquadFilter();
          high.type = 'highpass';
          high.frequency.value = 5000 + Math.random() * 4000;
          const gain = a.createGain();
          const dur = 0.012 + Math.random() * 0.03;
          gain.gain.setValueAtTime(0.05 * loud * Math.random(), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          src.connect(high).connect(gain).connect(surf.master);
          src.start(now, Math.random() * 3);
          src.stop(now + dur + 0.01);
        }

        /** 每帧：剖切线上水边那一点的涌浪相位每过一个整数就是一道新浪 */
        function updateAudio(dt) {
          if (!surf.enabled || !surf.ctx) return;
          const c = field.coast;
          const shore = shorelineX(state.level, state.cut);
          const phase = shore / (5.2 * c.swell.period) + state.time / c.swell.period + section.zPhase;
          const env = tideEnvelope(c);
          // 没有镜头远近，固定当作站在离水边不远处
          const proximity = 0.8;
          const loud = Math.min(1.2, 0.25 + proximity * 0.9) * Math.min(1.4, 0.5 + c.swell.height * 1.4);
          const index = Math.floor(phase);
          if (surf.lastWave >= 0 && index !== surf.lastWave) surfWave(loud);
          surf.lastWave = index;
          const tideNorm = (state.level - env.min) / (env.max - env.min);
          surf.lowGain.gain.setTargetAtTime(0.08 + 0.3 * tideNorm * (0.4 + proximity * 0.6), surf.ctx.currentTime, 1.5);
          if (surf.fizzBudget > 0) {
            if (Math.random() < 0.35 * Math.min(1, surf.fizzBudget / 40)) surfFizz(loud);
            surf.fizzBudget = Math.max(0, surf.fizzBudget - dt * 18);
          }
        }

        // ═══ 界面 ═════════════════════════════════════════════════════════
        const $ = (id) => document.getElementById(id);
        const textInput = $('text');
        const toastEl = $('toast');
        const cutHandle = $('cut');
        const fontData = getComputedStyle(document.documentElement).getPropertyValue('--data');
        const fontSerif = getComputedStyle(document.documentElement).getPropertyValue('--serif');
        let toastTimer = 0;

        function toast(message, duration = 3400) {
          clearTimeout(toastTimer);
          toastEl.textContent = message;
          toastEl.dataset.visible = 'true';
          toastTimer = setTimeout(() => (toastEl.dataset.visible = 'false'), duration);
        }

        const coastTabs = $('coasts');
        COASTS.forEach((c, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('role', 'radio');
          b.title = c.description;
          b.textContent = c.name;
          b.addEventListener('click', () => setCoast(i));
          coastTabs.append(b);
        });

        function syncControls() {
          [...coastTabs.children].forEach((b, i) => b.setAttribute('aria-checked', String(i === state.coastIndex)));
          [...$('speeds').children].forEach((b) => b.setAttribute('aria-checked', String(Number(b.dataset.speed) === state.speed)));
          [...$('tools').children].forEach((b) => b.setAttribute('aria-checked', String(b.dataset.tool === state.tool)));
          textInput.hidden = state.tool !== 'text';
          $('play').setAttribute('aria-label', state.playing ? '暂停潮汐' : '继续潮汐');
          $('play-icon').setAttribute('d', state.playing ? 'M7.5 5v10M12.5 5v10' : 'M7 4.8v10.4l8.5-5.2z');
          $('play-icon').parentElement.classList.toggle('icon--fill', !state.playing);
        }

        function setCoast(index) {
          if (index === state.coastIndex && field.coast) return;
          state.coastIndex = index;
          // 换海岸时保持当地的钟面时间
          const keep = field.coast ? localParts(state.jd, field.coast.tz) : null;
          if (keep) state.jd = localMidnightJd(keep.date, coast().tz) + keep.hours / 24;
          state.cut = 0;
          buildField(coast());
          layout();
          state.level = levelAt(state.jd);
          walkFootprints();
          state.needsWarmup = true;
          day = null;
          syncControls();
          if (!state.playing) writeUrl();
        }

        function setTime(jd) {
          const jump = Math.abs(jd - state.jd) > 1 / 24;
          state.jd = jd;
          if (jump) state.needsWarmup = true;
          emit(true);
          if (!state.playing) writeUrl();
        }

        const writeUrl = () => window.history.replaceState(null, '', buildUrl());

        $('play').addEventListener('click', togglePlay);
        function togglePlay() {
          state.playing = !state.playing;
          syncControls();
          if (!state.playing) writeUrl();
        }

        $('speeds').addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          state.speed = Number(b.dataset.speed);
          syncControls();
        });

        $('now').addEventListener('click', () => setTime(jdFromMs(Date.now())));

        $('tools').addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          state.tool = b.dataset.tool;
          syncControls();
          if (state.tool === 'text') {
            textInput.focus();
            toast('先写好字，再点一下平面里的沙滩');
          } else toast('在平面里拖动，就能在沙上划出痕迹');
        });

        $('erase').addEventListener('click', () => {
          field.trace.fill(0);
          toast('沙面抹平了');
        });

        $('sound').addEventListener('click', async () => {
          const on = await setSound(!surf.enabled);
          $('sound').setAttribute('aria-pressed', String(on));
          $('sound').setAttribute('aria-label', on ? '关闭海浪声' : '打开海浪声');
        });

        $('share').addEventListener('click', async () => {
          const url = new URL(buildUrl(), window.location.href).toString();
          try {
            await navigator.clipboard.writeText(url);
            toast('链接已复制，打开就是此刻的这片海');
          } catch {
            toast('无法写入剪贴板，请直接复制地址栏');
          }
        });

        $('date').addEventListener('change', (e) => {
          const value = e.target.value;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
          const hours = localParts(state.jd, coast().tz).hours;
          setTime(localMidnightJd(value, coast().tz) + hours / 24);
        });

        window.addEventListener('keydown', (e) => {
          if (e.code !== 'Space') return;
          const target = e.target;
          if (target && /^(INPUT|BUTTON|SELECT|TEXTAREA)$/.test(target.tagName)) return;
          if (target?.getAttribute?.('role') === 'slider') return;
          e.preventDefault();
          togglePlay();
        });

        // 在平面上书写：拖动划线，写字模式点一下压字
        let drawing = null;
        let hover = null;
        const textHeight = () => (L.narrow ? 26 : 32) / L.sx;
        const penRadius = () => Math.max((L.narrow ? 1.4 : 1.7) / L.sx, field.cell * 0.7);

        function toPlan(e) {
          const rect = canvas.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          if (cy < L.planTop || cy > L.planTop + L.planHeight) return null;
          return { cx, cy, x: field.x0 + cx / L.sx, z: L.planZ0 + (cy - L.planTop) / L.sx };
        }

        canvas.addEventListener('pointerdown', (e) => {
          const p = toPlan(e);
          if (!p) return;
          if (state.tool === 'text') {
            const text = textInput.value.trim();
            if (!text) {
              toast('先在下方写好字，再点一下沙滩');
              textInput.focus();
              return;
            }
            stampText(text, p.x, p.z, textHeight());
            textInput.value = '';
            return;
          }
          canvas.setPointerCapture(e.pointerId);
          drawing = { id: e.pointerId, x: p.x, z: p.z };
          addDab(p.x, p.z, penRadius(), 0.9);
        });

        canvas.addEventListener('pointermove', (e) => {
          const p = toPlan(e);
          hover = p;
          canvas.style.cursor = p ? (state.tool === 'text' ? 'text' : 'crosshair') : '';
          if (!drawing || e.pointerId !== drawing.id || !p) return;
          addStroke(drawing.x, drawing.z, p.x, p.z, penRadius());
          drawing.x = p.x;
          drawing.z = p.z;
        });

        const endDraw = (e) => {
          if (drawing?.id === e.pointerId) drawing = null;
        };
        canvas.addEventListener('pointerup', endDraw);
        canvas.addEventListener('pointercancel', endDraw);
        canvas.addEventListener('pointerleave', () => (hover = null));

        // 剖切位置：拖动平面左缘的 A，或聚焦后用方向键
        function placeCutHandle() {
          cutHandle.style.top = `${zy(state.cut)}px`;
          cutHandle.setAttribute('aria-valuenow', String(Math.round(((state.cut - L.planZ0) / (L.planZ1 - L.planZ0)) * 100)));
        }

        function setCut(z) {
          state.cut = clamp(z, L.planZ0 + 1.5, L.planZ1 - 1.5);
          buildSection();
          placeCutHandle();
        }

        cutHandle.addEventListener('pointerdown', (e) => {
          cutHandle.setPointerCapture(e.pointerId);
          e.preventDefault();
        });
        cutHandle.addEventListener('pointermove', (e) => {
          if (!cutHandle.hasPointerCapture(e.pointerId)) return;
          const rect = canvas.getBoundingClientRect();
          setCut(L.planZ0 + (e.clientY - rect.top - L.planTop) / L.sx);
        });
        cutHandle.addEventListener('keydown', (e) => {
          const step = e.shiftKey ? 5 : 1;
          if (e.key === 'ArrowUp') setCut(state.cut - step);
          else if (e.key === 'ArrowDown') setCut(state.cut + step);
          else return;
          e.preventDefault();
        });

        // 读数、潮汐表指针、诗与日月信息：每 100 毫秒刷新一次
        let lastEmit = 0;
        let poemIndex = -1;
        const COMPASS = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];

        function emit(force = false) {
          const now = performance.now();
          if (!force && day && now - lastEmit < 100) return;
          lastEmit = now;
          const c = coast();
          const local = localParts(state.jd, c.tz);
          if (!day || day.date !== local.date || day.coast !== c.id) {
            day = describeDay(c, local.date);
            day.coast = c.id;
            renderTable();
          }
          const datum = chartDatum(c);
          const level = levelAt(state.jd);
          const rate = tideRate(c.model, state.jd, c.lon);
          const next = findExtrema(c.model, c.lon, state.jd, state.jd + 0.6)[0];
          $('clock').textContent = local.clock;
          $('zone').textContent = c.tz === 'Asia/Tokyo' ? '日本时间' : '北京时间';
          const dateInput = $('date');
          if (document.activeElement !== dateInput) dateInput.value = local.date;
          $('moon').textContent = `${moonPhaseName(state.jd)} · ${springNeap(state.jd)}`;
          const sun = sunPosition(state.jd, c.lat, c.lon);
          const alt = sun.alt / DEG;
          const az = (((sun.az / DEG) % 360) + 360) % 360;
          $('sun').textContent = alt > -0.8 ? `太阳 高 ${alt.toFixed(0)}° · 偏${COMPASS[Math.round(az / 45) % 8]}` : `太阳在地平线下 ${(-alt).toFixed(0)}°`;
          $('r-height').textContent = (level - datum).toFixed(2);
          $('r-trend').textContent = rate >= 0 ? '正在涨潮' : '正在落潮';
          $('r-rate').textContent = Math.abs(rate * 100).toFixed(0);
          if (next) {
            const minutes = Math.round((next.jd - state.jd) * 1440);
            $('r-next-label').textContent = `下次${next.kind === 'high' ? '高潮' : '低潮'}`;
            $('r-next').textContent = localParts(next.jd, c.tz).clock;
            $('r-next-in').textContent = `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分后`;
          }
          const p = clamp((state.jd - day.start) / (day.end - day.start), 0, 1);
          $('table-head').style.left = `${p * 100}%`;
          $('table-clock').textContent = local.clock;
          tablePlot.setAttribute('aria-valuenow', String(Math.round(p * 1440)));
          tablePlot.setAttribute('aria-valuetext', `当地时间 ${local.clock}`);
          // 诗：每四分之一个半日潮（约 3.1 小时）换一段，与工程版同一节奏
          const index = ((Math.floor((state.jd * 24) / 3.105) % POEMS.length) + POEMS.length) % POEMS.length;
          if (index !== poemIndex) {
            poemIndex = index;
            const poem = POEMS[index];
            $('verse-zh').replaceChildren(
              ...poem.zh.split(/(?<=[，；])/).map((clause) => {
                const span = document.createElement('span');
                span.textContent = clause;
                return span;
              }),
            );
            $('verse-en').textContent = poem.en;
            const verse = $('verse');
            verse.style.animation = 'none';
            void verse.offsetWidth;
            verse.style.animation = '';
          }
        }

        /**
         * 界面色调：按天光带回差在两态之间切换，再用 1.2 秒过渡。
         * 线性跟随天光会在黄昏把墨色和底色一起推到中灰，文字几乎看不见。
         */
        function updateTone(daylight, now) {
          const prev = state.toneTarget;
          const target = daylight > 0.55 ? 1 : daylight < 0.45 ? 0 : (prev ?? (daylight >= 0.5 ? 1 : 0));
          if (target !== prev) {
            state.toneTarget = target;
            state.toneFrom = state.tone;
            state.toneStart = prev === null ? now - 1200 : now;
          }
          const k = clamp((now - state.toneStart) / 1200, 0, 1);
          state.tone = mix(state.toneFrom, target, k * k * (3 - 2 * k));
          const ink = mixRgb([236, 230, 217], [34, 33, 29], state.tone).map(Math.round);
          const veil = paperNow().map(Math.round);
          const root = document.documentElement.style;
          root.setProperty('--ink-rgb', ink.join(' '));
          root.setProperty('--veil-rgb', veil.join(' '));
          root.colorScheme = state.tone > 0.5 ? 'light' : 'dark';
          return ink;
        }

        const paperNow = () => mixRgb(NIGHT_PAPER, PAPER, state.tone);

        // ═══ 主循环 ═══════════════════════════════════════════════════════
        let last = performance.now();
        let slowFrames = 0;

        function frame(now) {
          requestAnimationFrame(frame);
          const dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          if (document.hidden) return;
          const started = performance.now();
          state.time += dt * (reduceMotion ? 0.4 : 1);
          if (state.playing) state.jd += (dt * state.speed) / 86400;
          const c = coast();
          state.level = levelAt(state.jd);
          const sky = skyState(state.jd, c);
          const ink = updateTone(sky.daylight, now);

          // 暂停只停潮汐钟：浪照常拍岸，场按真实时间推进
          if (state.needsWarmup) {
            warmup();
            state.needsWarmup = false;
          }
          stepField(state.level, state.time, (dt * (state.playing ? state.speed : 1)) / 3600);
          updateSection(state.level, state.time);
          emit();

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = css(paperNow());
          ctx.fillRect(0, 0, W, H);
          drawSky(sky);
          drawStars(sky, state.time);
          drawDome(sky, ink, day);
          drawSection(sky, ink, state.time);
          drawSectionNotes(ink, day);
          shadePlan(sky, state.time);
          drawPlan(ink);
          drawProjection(ink);
          drawGhost(ink);
          updateAudio(dt);

          // 持续掉帧时降到 1 倍像素密度
          if (performance.now() - started > 26) slowFrames++;
          else slowFrames = Math.max(0, slowFrames - 1);
          if (slowFrames > 90 && dpr > 1) {
            dpr = 1;
            slowFrames = 0;
            layout();
          }
        }

        document.addEventListener('visibilitychange', () => {
          last = performance.now();
          if (!surf.ctx) return;
          if (document.hidden) void surf.ctx.suspend();
          else if (surf.enabled) void surf.ctx.resume();
        });

        let resizeTimer = 0;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            // 跨过窄屏 / 宽屏的分界时换一套取景，场随之重建
            const narrow = window.innerWidth < 760;
            if (narrow !== L.narrow) {
              buildField(coast());
              walkFootprints();
              state.needsWarmup = true;
              state.cut = 0;
            }
            layout();
          }, 120);
        });

        // ═══ 调试接口 ═════════════════════════════════════════════════════
        // 仅给验收脚本用（tide-showcase/scripts/simple-audit.ts），页面自己的逻辑不读它。
        window.__TIDE__ = {
          variant: 'simple',
          snapshot: () => {
            const c = coast();
            const local = localParts(state.jd, c.tz);
            return { jd: state.jd, date: local.date, clock: local.clock, coast: c.id, level: state.level, rate: tideRate(c.model, state.jd, c.lon), playing: state.playing, speed: state.speed, cut: state.cut };
          },
          setTime: (jd) => setTime(jd),
          setPlaying: (on) => {
            if (state.playing !== on) togglePlay();
          },
          setSpeed: (speed) => {
            state.speed = speed;
            syncControls();
          },
          setCut: (z) => setCut(z),
          writeText: (text, x, z, heightM = textHeight()) => stampText(text, x, z, heightM),
          shoreline: (z) => shorelineX(state.level, z),
          fieldAt: (x, z, radius = 0) => {
            const f = field;
            let best = [0, 0, 0];
            const r = Math.ceil(radius / f.cell);
            const ci = Math.floor((x - f.x0) / f.cell);
            const cj = Math.floor((z - f.z0) / f.cell);
            for (let j = Math.max(0, cj - r); j <= Math.min(f.nz - 1, cj + r); j++) {
              for (let i = Math.max(0, ci - r); i <= Math.min(f.nx - 1, ci + r); i++) {
                const k = j * f.nx + i;
                if (f.trace[k] >= best[1]) best = [f.wet[k], f.trace[k], f.foam[k]];
              }
            }
            return best;
          },
          view: () => ({ x0: field.x0, x1: field.x1, z0: L.planZ0, z1: L.planZ1, planTop: L.planTop, planHeight: L.planHeight, sx: L.sx }),
        };

        // ═══ 启动 ═════════════════════════════════════════════════════════
        readUrl();
        buildField(coast());
        layout();
        state.level = levelAt(state.jd);
        walkFootprints();
        syncControls();
        emit(true);
        requestAnimationFrame(frame);
        setTimeout(() => toast('在下方平面里拖动就能在沙上写字，涨潮会把它收回', 5200), 900);
      })();
    </script>
  </body>
</html>
