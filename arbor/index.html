    <title>一木 · ARBOR（简易版）</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f4eb;
        --ink: #3a362c;
        --muted: rgb(58 54 44 / 55%);
        --faint: rgb(58 54 44 / 34%);
        --line: rgb(58 54 44 / 16%);
        --accent: #7a8a62;
        --serif: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif;
        --sans: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: auto; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        font-family: var(--sans);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* 页面高度即时间轴：10000px，五段各 2000px */
      body { height: 10000px; overflow-x: hidden; overscroll-behavior-y: none; }
      body.locked { overflow: hidden; height: 100vh; background: #302319; }
      body.locked .hud { opacity: 0; visibility: hidden; }
      button:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }

      #world {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        z-index: 0;
        touch-action: pan-y;
      }

      /* ---------- 抬头信息 ---------- */
      .hud {
        position: fixed;
        inset: 0;
        z-index: 3;
        padding: clamp(16px, 2.4vw, 38px);
        pointer-events: none;
        transition: opacity 0.8s ease;
      }

      .hud > * { pointer-events: auto; }

      .masthead {
        position: absolute;
        top: clamp(16px, 2.4vw, 38px);
        left: clamp(16px, 2.4vw, 38px);
        right: clamp(16px, 2.4vw, 38px);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(19px, 2.5vw, 30px);
        font-weight: 500;
        letter-spacing: 0.16em;
        line-height: 1.1;
      }

      .brand-en {
        display: block;
        margin-top: 0.5em;
        color: var(--faint);
        font-family: var(--sans);
        font-size: 0.34em;
        letter-spacing: 0.5em;
      }

      .tools { display: flex; gap: 10px; }

      .tool {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition: background 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
      }

      .tool:hover { background: rgb(206 172 116 / 16%); transform: translateY(-1px); }
      .tool svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .tool .strike { opacity: 0; transition: opacity 0.3s ease; }
      .tool[aria-pressed="false"] .strike { opacity: 1; }

      /* ---------- 诗句 ---------- */
      .poetry {
        position: absolute;
        left: clamp(24px, 4vw, 64px);
        bottom: clamp(96px, 17vh, 180px);
        width: clamp(240px, 24vw, 320px);
        color: var(--poem-ink, var(--ink));
      }

      .poetry-rule {
        display: block;
        width: 62px;
        height: 1px;
        margin-bottom: 20px;
        background: currentColor;
        opacity: 0.45;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 1.5s cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      .poetry.is-visible .poetry-rule { transform: scaleX(1); }

      .poetry-zh {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(14px, 1.5vw, 19px);
        line-height: 2.1;
        letter-spacing: 0.16em;
      }

      .poetry-zh .verse { display: block; white-space: nowrap; }

      .poetry-zh .char {
        display: inline-block;
        opacity: 0;
        transform: translateY(7px);
        transition: opacity 1.05s ease, transform 1.05s cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      .poetry-zh .char.punct { opacity: 0 !important; transition: opacity 0.9s ease; }

      .poetry.is-visible .poetry-zh .char { opacity: 1 !important; transform: none; }

      .poetry-en {
        margin: 0.9em 0 0;
        max-width: 30ch;
        color: inherit;
        font-size: clamp(10px, 1vw, 12px);
        letter-spacing: 0.06em;
        line-height: 1.9;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 1.3s ease, transform 1.3s ease;
      }

      .poetry.is-visible .poetry-en { opacity: 0.84; transform: none; }

      /* ---------- 阶段编年 ---------- */
      .chronicle {
        position: absolute;
        right: clamp(16px, 2.4vw, 38px);
        bottom: clamp(16px, 2.4vw, 38px);
        text-align: right;
        color: var(--footer-ink, var(--ink));
      }

      .chronicle-stage {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 10px;
        font-family: var(--serif);
        font-size: clamp(13px, 1.4vw, 17px);
        letter-spacing: 0.18em;
      }

      .chronicle-stage span:first-child { opacity: 0.7; font-size: 0.78em; }

      .chronicle-track {
        width: min(220px, 42vw);
        height: 1px;
        margin-top: 12px;
        margin-left: auto;
        background: currentColor;
        opacity: 0.6;
      }

      .chronicle-bar {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left center;
      }

      /* ---------- 滚动提示 ---------- */
      .scroll-hint {
        position: absolute;
        left: 50%;
        bottom: clamp(18px, 3vh, 34px);
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.42em;
        transition: opacity 0.8s ease;
      }

      .scroll-hint i {
        display: block;
        width: 1px;
        height: 26px;
        margin: 10px auto 0;
        background: linear-gradient(currentColor, transparent);
        animation: hint 2.6s ease-in-out infinite;
      }

      @keyframes hint {
        0%, 100% { opacity: 0.25; transform: scaleY(0.6); }
        50% { opacity: 1; transform: scaleY(1); }
      }

      /* ---------- 开场 ---------- */
      .intro {
        position: fixed;
        inset: 0;
        z-index: 6;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f6ecd9;
        background: transparent;
        transition: opacity 1.1s ease;
      }

      .intro.gone { opacity: 0; pointer-events: none; }

      .intro-inner { width: min(560px, 88vw); text-align: center; }

      .intro-kicker {
        color: #d0b68d;
        font-family: var(--serif);
        font-size: clamp(10px, 1.1vw, 12px);
        letter-spacing: 0.34em;
      }

      .intro-title {
        margin: 0.55em 0 0;
        font-family: var(--serif);
        font-size: clamp(40px, 6.4vw, 76px);
        font-weight: 500;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
      }

      .intro-en {
        margin-top: 1em;
        color: #d0b68d;
        font-size: clamp(10px, 1.1vw, 12px);
        letter-spacing: 0.86em;
        text-indent: 0.86em;
      }

      .intro-copy {
        margin: 2.2em 0 0;
        color: #e2d4be;
        font-family: var(--serif);
        font-size: clamp(12px, 1.3vw, 15px);
        line-height: 2.1;
        letter-spacing: 0.08em;
      }

      .intro-btn {
        margin-top: 2.6em;
        padding: 13px 30px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 50px;
        border: 1px solid #e1c894;
        border-radius: 999px;
        background: #d5b57e;
        color: #2b2118;
        box-shadow: 0 8px 28px rgb(24 16 10 / 18%);
        font-family: var(--serif);
        font-size: clamp(13px, 1.4vw, 16px);
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        cursor: pointer;
        transition: background 0.5s ease, letter-spacing 0.5s ease, border-color 0.5s ease;
      }

      .intro-btn:hover { background: #e4c693; letter-spacing: 0.32em; border-color: #f0d7ab; }
      .intro-btn .arrow { transition: transform 0.5s ease; }
      .intro-btn:hover .arrow { transform: translateX(4px); }

      .intro-note { margin-top: 1.8em; color: #cbb590; font-size: 11px; letter-spacing: 0.3em; }

      @media (max-width: 760px), (max-aspect-ratio: 1/1) {
        .poetry { left: 24px; width: calc(100% - 48px); bottom: 84px; }
        .poetry-rule { width: 40px; margin-bottom: 12px; }
        .poetry-zh { font-size: 15px; line-height: 1.9; letter-spacing: 0.1em; }
        .poetry-en { max-width: 42ch; font-size: 11px; line-height: 1.65; }
        .scroll-hint { display: none; }
        .intro-copy { font-size: 13px; }
      }

      @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
        .poetry { left: 24px; bottom: 64px; width: 232px; }
        .poetry-rule { margin-bottom: 12px; }
        .poetry-zh { font-size: 14px; line-height: 1.8; }
        .poetry-en { font-size: 10px; line-height: 1.6; }
        .intro-title { font-size: 38px; margin-top: 0.3em; }
        .intro-copy { margin-top: 1em; }
        .intro-btn { margin-top: 1.2em; }
        .intro-note { margin-top: 1em; }
      }

      @media (prefers-reduced-motion: reduce) {
        .scroll-hint i { animation: none; }
        .poetry-zh .char, .poetry-en, .poetry-rule { transition-duration: 0.01s !important; }
      }
    </style>
  </head>
  <body class="locked">
    <canvas id="world" aria-label="滚动驱动的程序化大树：从种子破土、拔节、分叉到结果与飞鸟归巢"></canvas>

    <div class="hud" id="hud" inert>
      <header class="masthead">

    <div class="intro" id="intro">
      <div class="intro-inner">
        <div class="intro-kicker">不 催 一 叶 ， 不 问 归 期</div>
        <h2 class="intro-title">一木</h2>

        <p class="intro-copy">落一粒种子，留一处清静。<br />看它慢慢长成自己的模样。</p>
        <button class="intro-btn" id="beginBtn" type="button"><span>落子生根</span><span class="arrow">→</span></button>
